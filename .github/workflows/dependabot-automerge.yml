name: "Dependabot Auto Approve and Merge"
permissions: read-all
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  call-automerge:
    uses: flowlogix/base-pom/.github/workflows/dependabot-automerge.yml@a632e001ff1b7a9f239298a5ade16e530cce2415 # v152
    permissions:
      checks: read
      contents: write
      pull-requests: write
    secrets:
      github-token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
