name: "Dependabot Auto Approve and Merge"
permissions: read-all
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  call-automerge:
    uses: flowlogix/base-pom/.github/workflows/dependabot-automerge.yml@543817f2c114207d291a4401da90efa40736547b # v143
    permissions:
      contents: write
      pull-requests: write
    secrets:
      github-token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
